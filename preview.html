<div class="layout"><aside class="sidebar"><div class="brand">✦ <b>Jarvis</b></div><div class="tagline">你的个人 AI 工作台</div><div class="nav-label">工作空间</div><nav class="nav" id="nav"></nav><div class="side-bottom"><span class="status">● 演示环境</span><br>使用模拟数据<br>未连接任何账户</div></aside>
<main class="main"><div class="topline"><span>个人工作台　/　<span id="crumb">总览</span></span><span class="profile">✦　我的空间</span></div><div id="view"></div></main></div><div id="overlay"></div><div id="toast" class="toast hidden"></div>
<script id="legacy-v0">
/* 历史版本（M0 单助手原型）· 已被文件末尾 app-v3 取代，仅保留对照，勿在此处修改 */
const pages=[['总览','⌂'],['邮件','✉'],['X 收藏与点赞','♡'],['知识库','▤'],['待办','✓'],['待审批','◷']];let current='总览';let done=new Set();let extraTodos=[];let notes=[['Jarvis MVP：先建议，后执行','产品设计 · 11 月 5 日','首版应先完成分类、摘要、搜索与待办关联。发送、删除和发布操作要走逐项审批。'],['邮件分级规则草案','工作流程 · 11 月 4 日','按截止时间、是否需要回复、是否来自重要联系人进行初步分级；低置信度项目交给用户判断。'],['AI 助手界面参考','产品灵感 · 11 月 2 日','减少同时出现的信息量。首页只呈现今天要处理的事，并提供返回来源的入口。']];
const emails=[['M','Maya Chen','关于周五产品评审的材料','请在周四下班前补上用户访谈的关键发现，评审会需要用到。','需要回复','高优先'],['N','Notion','你的每周工作摘要','本周有 3 个页面更新，包含 Jarvis 竞品调研和用户访谈记录。','摘要','工作'],['L','Leo Wang','Re: 会议时间确认','周三下午 3 点可以，我会提前把议程发给你。','待确认','日程']];
const posts=[['@designsystems','好的产品界面会让复杂的事情变得简单。先把用户最常做的三件事做顺，再慢慢扩展。','产品设计 · 2 小时前','产品'],['@linh_builds','用小步迭代做 AI 工具：每次只让模型给建议，把最终决定留给用户。','AI 工具 · 昨天','AI 开发']];
const baseTodos=[['整理用户访谈的 5 条关键发现','今天 · 来自 Maya 的邮件','高优先'],['完成 Jarvis 首页低保真草图','明天 · 产品规划','进行中'],['阅读 OAuth 权限申请说明','11 月 10 日 · 技术调研','普通'],['把喜欢的产品案例归入知识库','11 月 12 日 · X 收藏','普通']];
function initNav(){document.querySelector('#nav').innerHTML=pages.map(([n,i])=>`<button data-page="${n}" class="${n===current?'active':''}"><span class="icon">${i}</span><span class="label">${n}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}function go(p){current=p;document.querySelector('#crumb').textContent=p;initNav();render()}
function section(t,h=''){return `<div class="section"><h2>${t}</h2><span class="hint">${h}</span></div>`}function mailRows(items=emails){return `<div class="panel">${items.map(e=>`<div class="mail"><div class="avatar">${e[0]}</div><div><div class="subject">${e[2]}</div><div class="from">${e[1]}　<span class="pill">${e[4]}</span>${e[5]==='高优先'?'<span class="pill hot">高优先</span>':''}</div><div class="summary">${e[3]}</div></div></div>`).join('')}</div>`}function todoRows(){let all=[...baseTodos,...extraTodos];return `<div class="panel todos">${all.map((t,i)=>`<label class="todo"><input type="checkbox" data-todo="${i}" ${done.has(i)?'checked':''}><span><span class="todo-title ${done.has(i)?'done':''}">${t[0]}</span><div class="todo-meta">${t[1]} · ${t[2]}</div></span></label>`).join('')}</div>`}function approvalCards(){return `<div class="approval"><div class="type">邮件草稿 · 等待确认</div><b>回复 Maya：周五产品评审材料</b><small>收件人、主题和正文将在发送前完整展示</small></div><div class="approval"><div class="type">整理建议 · 等待确认</div><b>为 6 条收藏添加「产品灵感」标签</b><small>仅影响 Jarvis 内部分类，不会修改 X</small></div>`}function postCards(arr=posts){return `<div class="posts">${arr.map(p=>`<div class="post"><div class="author">${p[0]}　·　${p[2]}</div><div class="copy">${p[1]}</div><div class="post-meta">♡　已点赞　　<span class="pill">${p[3]}</span></div></div>`).join('')}</div>`}
function home(){return `<div class="command-head"><div><div class="kicker">PERSONAL OPERATIONS SYSTEM　/　06 NOV 2026</div><h1 class="command-title">今日态势 · 任务总览</h1><div class="command-sub">信息已整理就绪。所有动作均等待你的指令。</div></div><div class="sim-badge">● SIMULATION MODE　/　NO ACCOUNTS LINKED</div></div><div class="metrics"><div class="metric"><small>INBOX / 待处理邮件</small><strong>08</strong><em>2 封建议优先处理</em></div><div class="metric"><small>任务队列 / 今日待办</small><strong>${baseTodos.length+extraTodos.length-done.size}</strong><em>1 项来自邮件</em></div><div class="metric"><small>确认队列 / 等待审批</small><strong>02</strong><em>外部动作锁定</em></div><div class="metric"><small>知识信号 / 新收集</small><strong>12</strong><em>本地索引 · 模拟值</em></div></div><div class="hud-grid"><section class="hud-panel">${section('INCOMING SIGNALS','MAIL / 03')}${mailRows()}</section><section class="core-wrap"><div class="scan-line"></div><div class="core-data"><span>LOCAL INDEX　·　STANDBY</span><span>TRUST BOUNDARY　/　ON</span></div><div class="core-inner"><div class="core-label">PERSONAL AI SYSTEM</div><div class="core-name">J.A.R.V.I.S.</div><div class="core-ring"><div class="core-axis"></div><div class="core-orb"></div></div><div class="core-state">● READY　/　AWAITING INPUT</div><div class="core-readout"><span>SYNC <b>LOCAL</b></span><span>AI <b>IDLE</b></span><span>WRITE <b>LOCKED</b></span></div></div></section><section class="hud-panel">${section('MISSION QUEUE','TASKS / TODAY')}${todoRows()}<div class="micro-status" style="margin:10px 2px">${baseTodos.length+extraTodos.length-done.size} ACTIVE ITEMS　·　1 LINKED TO EMAIL</div></section></div><div class="lower-grid"><section class="lower-panel">${section('CAPTURED DATA','X / KNOWLEDGE')}${postCards()}</section><section class="lower-panel">${section('AUTHORIZATION QUEUE','HUMAN APPROVAL REQUIRED')}${approvalCards()}</section></div><div class="footer">HUD CONCEPT PREVIEW　·　SIMULATED CONTENT ONLY　·　NO EXTERNAL SERVICE CONNECTION</div>`}
function mailPage(){return `<div class="kicker">邮件工作区</div><h1 class="page-title">把收件箱理出头绪。</h1><p class="intro">摘要和优先级仅供参考；回复发送前必须由你确认。</p><div class="toolbar"><input id="mailq" placeholder="搜索发件人、主题或内容…"><select id="mailfilter"><option>全部邮件</option><option>需要回复</option><option>高优先</option></select></div><div id="mailresults" class="list"></div>${section('回复草稿预览（模拟）')}<div class="formbox"><input value="maya@example.com" aria-label="收件人"><input value="Re: 关于周五产品评审的材料" aria-label="主题"><textarea aria-label="邮件正文">Hi Maya，收到。我会在周四下班前补充用户访谈的关键发现，并提前发给你。</textarea><div class="demo-warning">这是本地演示草稿。发送功能未连接；真实邮件发送需要逐封审批。</div><button class="btn" onclick="toast('演示草稿已保留在本地页面')">保存草稿</button></div>`}
function renderMails(){let q=(document.querySelector('#mailq')?.value||'').toLowerCase(),f=document.querySelector('#mailfilter')?.value;let arr=emails.filter(e=>(!q||e.join(' ').toLowerCase().includes(q))&&(f==='全部邮件'||(f==='需要回复'?e[4]==='需要回复':e[5]==='高优先')));document.querySelector('#mailresults').innerHTML=arr.map((e,i)=>`<div class="card"><h3>${e[2]}　<span class="pill">${e[5]}</span></h3><p>${e[1]}　·　${e[3]}</p><div class="actions"><button class="btn" onclick="toast('已生成本地模拟草稿')">生成回复草稿</button><button class="btn" onclick="toast('已加入演示待办')">转为待办</button></div></div>`).join('')||'<div class="card">没有匹配的邮件</div>'}
function xPage(){return `<div class="kicker">个人内容收藏</div><h1 class="page-title">把好内容留在手边。</h1><p class="intro">下面是模拟内容。标签只保存在 Jarvis，不会回写 X。</p><div class="toolbar"><input id="postq" placeholder="搜索内容、作者或标签…"><select><option>全部来源</option><option>书签</option><option>点赞</option></select><select><option>全部主题</option><option>产品</option><option>AI 开发</option></select></div><div id="postresults">${postCards()}</div><div class="demo-warning">官方 X API 的连接、同步和费用统计尚未启用。</div>`}
function renderPosts(){let q=(document.querySelector('#postq')?.value||'').toLowerCase();document.querySelector('#postresults').innerHTML=postCards(posts.filter(p=>p.join(' ').toLowerCase().includes(q)))}
function kbPage(){return `<div class="kicker">个人知识库</div><h1 class="page-title">收集、连接、再利用。</h1><p class="intro">先从手动笔记和本地文件开始；当前内容均为模拟数据。</p><div class="toolbar"><input id="noteq" placeholder="搜索笔记内容或主题…"><button class="btn primary" onclick="document.querySelector('#newnote').classList.toggle('hidden')">＋ 新建笔记</button></div><div id="newnote" class="formbox hidden"><input id="notetitle" placeholder="笔记标题"><textarea id="notebody" placeholder="写下你的想法…"></textarea><button class="btn primary" onclick="saveNote()">保存到知识库</button></div><div id="noteresults"></div>`}
function renderNotes(){let q=(document.querySelector('#noteq')?.value||'').toLowerCase();document.querySelector('#noteresults').innerHTML=notes.filter(n=>n.join(' ').toLowerCase().includes(q)).map(n=>`<div class="note"><h3>${n[0]}</h3><small>${n[1]}</small><p>${n[2]}</p><button class="btn" onclick="toast('演示：可将内容转成待办')">提取待办</button></div>`).join('')}
function saveNote(){let t=document.querySelector('#notetitle').value,b=document.querySelector('#notebody').value;if(!t)return toast('请填写笔记标题');notes.unshift([t,'刚刚 · 本地演示',b]);render();toast('笔记已加入当前演示列表')}
function todoPage(){return `<div class="kicker">任务管理</div><h1 class="page-title">一步一步推进。</h1><p class="intro">每条任务都可以回到它的来源。</p><div class="formbox"><input id="newtodo" placeholder="接下来要做什么？"><button class="btn primary" onclick="addTodo()">添加待办</button></div>${section('全部待办','按紧急程度排列')}${todoRows()}`}
function addTodo(){let x=document.querySelector('#newtodo').value.trim();if(!x)return toast('先写下待办内容');extraTodos.push([x,'明天 · Jarvis','普通']);render();toast('待办已添加')}
function approvalsPage(){return `<div class="kicker">安全控制</div><h1 class="page-title">每个动作，都由你拍板。</h1><p class="intro">此原型只演示审批交互，不会连接服务或执行任何外部操作。</p>${section('等待确认','请逐项查看操作内容')}<div class="approval"><div class="type">邮件草稿 · 模拟</div><b>回复 Maya Chen：关于周五产品评审的材料</b><small>收件人：maya@example.com · 主题和正文需在发送前确认</small></div><details class="card"><summary>查看完整邮件草稿</summary><div class="formbox"><p>收件人：maya@example.com</p><p>主题：Re: 关于周五产品评审的材料</p><textarea>Hi Maya，收到。我会在周四下班前补充用户访谈的关键发现，并提前发给你。</textarea></div><div class="demo-warning">模拟演示：点击确认也不会发送邮件。真实版本会再次核对收件人与正文。</div></details><p><label><input id="confirm" type="checkbox"> 我已检查完整内容，理解真实操作会产生外部影响</label></p><button class="btn primary" id="approve" disabled onclick="toast('这是演示页面，没有执行任何外部操作')">确认并继续</button>${section('整理建议','只改变 Jarvis 内部数据')}<div class="approval"><div class="type">本地标签建议</div><b>为 6 条收藏添加「产品灵感」标签</b><small>不会修改 X 上的收藏或点赞状态</small><div class="actions"><button class="btn" onclick="toast('已接受本地整理建议')">接受建议</button><button class="btn" onclick="toast('已忽略建议')">忽略</button></div></div>`}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2300)}
function bind(){document.querySelectorAll('[data-todo]').forEach(x=>x.onchange=()=>{let i=+x.dataset.todo;x.checked?done.add(i):done.delete(i);render()});let mq=document.querySelector('#mailq');if(mq){mq.oninput=renderMails;document.querySelector('#mailfilter').onchange=renderMails;renderMails()}let pq=document.querySelector('#postq');if(pq)pq.oninput=renderPosts;let nq=document.querySelector('#noteq');if(nq){nq.oninput=renderNotes;renderNotes()}let c=document.querySelector('#confirm');if(c)c.onchange=()=>document.querySelector('#approve').disabled=!c.checked}
function render(){let v=document.querySelector('#view');v.innerHTML=current==='总览'?home():current==='邮件'?mailPage():current==='X 收藏与点赞'?xPage():current==='知识库'?kbPage():current==='待办'?todoPage():approvalsPage();bind()}initNav();render();
</script>

<script id="app-v3">
/* =====================================================================
   Jarvis v0.3 · 增量 A 原型
   双助手切换 / 独立会话 / 记忆分区与续聊卡 / 统一收集箱 / 设置与隐私
   纯模拟：不连接任何账号、不调用任何模型，数据只存在本浏览器的 localStorage
   上一段 script#legacy-v0 为历史版本；本段是唯一状态源
   ===================================================================== */
(function () {
'use strict';

var STORE_KEY = 'jarvis.preview.v3';
var PAGES = [['总览','⌂'],['对话','✦'],['邮件','✉'],['收藏','♡'],['知识','▤'],['任务','✓'],['审批','◷'],['记忆','❖'],['收集','＋']];
var RESTRICTED = { '邮件':1, '收藏':1, '知识':1, '审批':1 };
var NS_LABEL = { shared:'个人资料（共享）', companion:'陪伴记忆', work:'工作记忆', raw:'会话原文' };
var METHOD_LABEL = { official_api:'官方 API', extension:'浏览器剪藏', share:'系统分享', clipboard_hotkey:'快捷键/剪贴板', file_import:'文件导入', manual:'手动录入' };
var PRI_ORDER = { '高':0, '普通':1, '低':2 };
var STATE_LABEL = { pending:'等待确认', changed:'载荷已变更', approved:'已批准', rejected:'已拒绝', expired:'已过期', executed:'已执行（模拟）', failed:'执行失败' };

/* ---------- 基础工具 ---------- */
function nowIso(){ return new Date().toISOString(); }
function iso(days, hours){ var d=new Date(); d.setDate(d.getDate()+(days||0)); d.setHours(d.getHours()+(hours||0)); return d.toISOString(); }
function pad2(n){ return n<10 ? '0'+n : String(n); }
function todayLabel(){ var d=new Date(); return d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate()); }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function clip(s,n){ s=String(s==null?'':s); n=n||16; return s.length>n ? s.slice(0,n)+'…' : s; }
function hash(o){ var s=JSON.stringify(o), h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return 'h'+h.toString(16); }
function rel(isoStr){ var t=new Date(isoStr).getTime(); if(isNaN(t)) return ''; var m=Math.round((Date.now()-t)/60000); if(m<1) return '刚刚'; if(m<60) return m+' 分钟前'; if(m<1440) return Math.round(m/60)+' 小时前'; return Math.round(m/1440)+' 天前'; }
function left(isoStr){ var m=Math.round((new Date(isoStr).getTime()-Date.now())/60000); if(m<=0) return '已过期'; if(m<60) return m+' 分钟后过期'; return Math.round(m/60)+' 小时后过期'; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function mailAddr(name){ return String(name).toLowerCase().replace(/[^a-z]+/g,'.')+'@example.com'; }

/* ---------- 种子数据（唯一假数据入口） ---------- */
function seedData(){
  return {
    version:3,
    assistant:'jarvis',
    page:'总览',
    noticeSeen:false,
    settings:{ noticeEvery:true, reduced:false, companionName:'陪伴助手', jarvisName:'JARVIS' },
    ui:{ mailQ:'', mailFilter:'全部邮件', postQ:'', postSource:'全部来源', postTopic:'全部主题', kbQ:'', memNs:'全部', capQ:'' },

/* ---------- 持久化 ---------- */
function normalize(state){
  (state.proposals||[]).forEach(function(p){ if(!p.hash) p.hash=hash(p.payload); });
  return state;
}
function load(){
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(raw){ var o=JSON.parse(raw); if(o && o.version===3) return normalize(o); }
  }catch(err){}
  return normalize(seedData());
}
var S = load();
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(err){} }

/* ---------- 派生 ---------- */
function asName(a){ return a==='companion' ? (S.settings.companionName||'陪伴助手') : (S.settings.jarvisName||'JARVIS'); }
function asKey(a){ return a==='companion' ? 'COMPANION RUNTIME' : 'PERSONAL AI SYSTEM'; }
function memVisible(m, a){ return !m.forgotten && m.visible.indexOf(a)>=0; }
function memFor(a){ return S.memories.filter(function(m){ return memVisible(m,a); }); }
function openTodos(){ return S.todos.filter(function(t){ return t.status!=='done'; }); }
function pendingProposals(){ return S.proposals.filter(function(p){ var st=pState(p); return st==='pending'||st==='changed'||st==='approved'; }); }
function pState(p){
  if(p.status==='pending'){
    if(new Date(p.expiresAt).getTime()<Date.now()) return 'expired';
    if(p.hash && p.hash!==hash(p.payload)) return 'changed';
  }
  return p.status;
}
function allowed(page){ if(S.assistant==='jarvis') return true; return !RESTRICTED[page] || sessionGrants[page]===true; }
function audit(event, detail){ S.audit.unshift({ id:uid('a'), at:nowIso(), event:event, detail:detail }); if(S.audit.length>60) S.audit.length=60; }
function toast(msg){
  var t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toast._h); toast._h=setTimeout(function(){ t.classList.add('hidden'); },2600);
}
function recall(a, text){
  var t=String(text||''), list=memFor(a);
  return list.map(function(m){
    var score=m.confidence||0.5, hit=false;
    for(var i=0;i<t.length-1;i++){ if(m.content.indexOf(t.substr(i,2))>=0){ hit=true; break; } }
    if(hit) score+=0.25;
    return { m:m, score:score };
  }).sort(function(x,y){ return y.score-x.score; }).slice(0,2).map(function(x){ return x.m; });
}

function bubbleHTML(m){
  var mems=(m.mem||[]).map(findMem).filter(Boolean);
  return '<div class="v3-msg'+(m.role==='me'?' me':'')+'">'+nl(m.text)+
    (mems.length?'<span class="v3-src">我记得：'+esc(mems.map(function(x){ return clip(x.content,26)+'（来源：'+x.sources[0]+'）'; }).join('；'))+'</span>':'')+
    '<span class="v3-src">'+esc(rel(m.at))+(m.role==='me'?' · 你':' · '+asName(S.assistant))+'</span></div>';
}
function sendChat(){
  var box=document.getElementById('chat-input'); if(!box) return;
  var text=box.value.trim(); if(!text) return toast('先输入内容');
  if(S.settings.noticeEvery || !S.noticeSeen){ pendingSend=text; openNotice(); return; }
  doSend(text);
}
function doSend(text){
  var a=S.assistant;
  S.chat[a]=S.chat[a]||[];
  S.chat[a].push({ id:uid('c'), role:'me', text:text, at:nowIso() });
  var hit=recall(a,text);
  var reply = a==='companion'
    ? '（模拟回复）我在。你刚说的「'+clip(text,18)+'」，我想先确认：这件事最让你在意的是哪一部分？'
    : '（模拟回复）收到。我会把它整理成待办，等你确认后再进入任务队列；外部动作仍然不会自动执行。';
  S.chat[a].push({ id:uid('c'), role:'ai', text:reply, at:nowIso(), mem:hit.map(function(m){ return m.id; }) });
  S.noticeSeen=true; save(); render();
  var log=document.getElementById('chat-log'); if(log) log.scrollTop=log.scrollHeight;
}
function genSnapshot(){
  var a=S.assistant, msgs=S.chat[a]||[];
  var topics=[], seen={};
  msgs.filter(function(m){ return m.role==='me'; }).slice(-4).forEach(function(m){
    var t=clip(m.text,14); if(!seen[t]){ seen[t]=1; topics.push(t); }
  });
  S.snapshots.unshift({ id:uid('sn'), assistant:a, topics:topics.length?topics:['（本次会话尚未展开话题）'], open:['待你确认的下一步'], status:'draft', createdAt:nowIso() });
  save(); render(); toast('续聊卡草案已生成，请逐条审阅');
}
function acceptSnapshot(id){
  var sn=S.snapshots.filter(function(s){ return s.id===id; })[0]; if(!sn) return;
  sn.status='accepted'; audit('snapshot.accepted', asName(sn.assistant)+' 续聊卡已接受：'+sn.topics.join('、'));
  save(); render(); toast('已接受：新会话只会带入选中的话题与来源');
}
function discardSnapshot(id){
  S.snapshots=S.snapshots.filter(function(s){ return s.id!==id; });
  audit('snapshot.discarded','续聊卡草案被丢弃，未写入长期记忆');
  save(); render(); toast('已丢弃，未写入长期记忆');
}
function startFromSnapshot(id){
  var sn=S.snapshots.filter(function(s){ return s.id===id; })[0]; if(!sn) return;
  S.assistant=sn.assistant;
  S.chat[sn.assistant]=[{
    id:uid('c'), role:'ai', at:nowIso(),
    text:'（新会话，已按续聊卡恢复）上次停在：'+sn.topics.join('、')+'。你想接着哪一条聊？',
    mem: memFor(sn.assistant).slice(0,1).map(function(m){ return m.id; })
  }];
  S.noticeSeen=true; save(); render(); toast('新会话已按续聊卡恢复');
}

function draftBlock(){
  if(!S.draft) return '<div class="formbox"><div class="v3-empty">选择一封邮件并点「生成回复草稿」，草稿会显示在这里，并固定绑定那封邮件。</div></div>';

    '<div class="v3-meta">草稿绑定：'+esc(S.draft.source)+'　·　地址为示例值（未验证收件人）</div>'+
    '<input class="v3-input" id="draft-to" value="'+esc(S.draft.to)+'" aria-label="收件人" placeholder="收件人">'+
    '<input class="v3-input" id="draft-subject" value="'+esc(S.draft.subject)+'" aria-label="主题" placeholder="主题">'+
    '<textarea class="v3-input" id="draft-body" aria-label="正文">'+esc(S.draft.body)+'</textarea>'+
    '<div class="demo-warning">发送能力关闭。保存后只会变成待审批动作，不会产生任何外部请求。</div>'+
    '<div class="v3-actions"><button class="btn primary" data-act="draft-save">保存为待审批草稿</button>'+

function mailDraft(id){
  var e=S.emails.filter(function(x){ return x.id===id; })[0]; if(!e) return;
  S.draft={ id:uid('d'), emailId:e.id, source:e.from+' · '+e.subject, to:mailAddr(e.from), subject:'Re: '+e.subject,
    body:'Hi '+e.from.split(' ')[0]+'，收到。我会按你的要求在截止前补齐内容，并在提交前再和你确认一次。' };
  e.unread=false; save(); render(); toast('草稿已绑定这封邮件，可继续编辑');
}
function saveDraft(){
  var to=(document.getElementById('draft-to')||{}).value||'', sub=(document.getElementById('draft-subject')||{}).value||'', body=(document.getElementById('draft-body')||{}).value||'';
  if(!to.trim()||!sub.trim()||!body.trim()) return toast('收件人、主题、正文都不能为空');
  var payload={ to:to.trim(), subject:sub.trim(), body:body };
  var p={ id:uid('ap'), kind:'email_draft', title:'回复：'+clip(sub.replace(/^Re:\s*/,''),26), payload:payload, status:'pending', createdAt:nowIso(), expiresAt:iso(0,4), hash:hash(payload) };
  S.proposals.unshift(p);
  audit('proposal.created','邮件草稿进入审批队列：'+p.title);
  S.draft=null; save(); render(); toast('已保存为待审批动作（不会发送）');
}

function addTodo(title, priority, due, source){
  S.todos.unshift({ id:uid('t'), title:title, due:due||'未设置', priority:priority||'普通', status:'open', source:source||'', owner:S.assistant });
  audit('todo.created','创建待办：'+title);
}
function newTodoFromForm(){
  var t=(document.getElementById('todo-title')||{}).value||'';
  var p=(document.getElementById('todo-pri')||{}).value||'普通';

function kindLabel(kind){

}

  var open=pendingProposals(), done=S.proposals.filter(function(p){ var st=pState(p); return ['rejected','executed','expired','failed'].indexOf(st)>=0; });
  return head('审批与记录','每个动作都由你拍板：先看完整载荷，再决定批准或拒绝。')+
    sec('等待确认','共 '+open.length+' 项待处理')+
    (open.length ? open.map(function(p){
      var st=pState(p);
      return '<div class="card"><div class="v3-meta">'+esc(kindLabel(p.kind))+'　·　<span class="'+(st==='changed'?'v3-lock':'')+'">'+esc(STATE_LABEL[st]||st)+'</span>　·　'+esc(left(p.expiresAt))+'</div>'+

        '<div class="v3-meta">载荷哈希 '+esc(p.hash||'-')+'　·　创建于 '+esc(rel(p.createdAt))+'</div>'+
        '<div class="v3-actions"><button class="btn primary" data-act="proposal-open" data-id="'+p.id+'">查看完整载荷</button>'+
        '<button class="btn" data-act="proposal-reject" data-id="'+p.id+'">拒绝</button></div></div>';
    }).join('') : empty('没有等待确认的动作'))+
    sec('已处理','保留结果供回溯')+
    (done.length ? done.map(function(p){
      var st=pState(p);
      return '<div class="card"><div class="v3-meta">'+esc(kindLabel(p.kind))+'　·　'+esc(STATE_LABEL[st]||st)+'　·　'+esc(rel(p.approvedAt||p.createdAt))+'</div><h3 class="subject">'+esc(p.title)+'</h3></div>';
    }).join('') : empty('暂无已处理动作'))+
    sec('审计记录','只追加、不记录正文与凭据')+
    (S.audit.length ? S.audit.slice(0,12).map(function(a){
      return '<div class="v3-audit"><b>'+esc(a.event)+'</b><span>'+esc(a.detail)+'</span><span>'+esc(rel(a.at))+'</span></div>';
    }).join('') : empty('暂无审计记录'));
}
function openProposal(id){
  var p=S.proposals.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  var st=pState(p), body='';
  if(p.kind==='email_draft'){
    body='<div class="v3-meta">收件人 / 主题 / 正文都会进入载荷哈希；任何改动都会让已批准的记录失效。</div>'+
      '<div class="v3-kv"><dt>收件人</dt><dd>'+esc(p.payload.to)+'</dd><dt>主题</dt><dd>'+esc(p.payload.subject)+'</dd></div>'+
      '<textarea class="v3-input" id="pl-body" data-edit="payload-body" data-id="'+p.id+'" aria-label="正文">'+esc(p.payload.body)+'</textarea>';
  } else {
    body='<div class="v3-kv"><dt>标签</dt><dd>'+esc(p.payload.label)+'</dd><dt>影响范围</dt><dd>'+esc(p.payload.count)+' 条</dd><dt>作用域</dt><dd>'+esc(p.payload.scope||'本地')+'</dd></div>';
  }
  showSheet('<h2>'+esc(p.title)+'</h2>'+
    '<p class="v3-sub">'+esc(kindLabel(p.kind))+'　·　'+esc(STATE_LABEL[st]||st)+'　·　'+esc(left(p.expiresAt))+'</p>'+
    body+
    '<div class="v3-kv"><dt>载荷哈希</dt><dd><span id="hashv-'+p.id+'">'+esc(p.hash||'-')+'</span></dd>'+
      '<dt>状态</dt><dd><span id="stt-'+p.id+'">'+esc(STATE_LABEL[st]||st)+'</span></dd>'+
      '<dt>创建时间</dt><dd>'+esc(rel(p.createdAt))+'</dd></div>'+
    '<label class="v3-meta" style="display:block;margin-top:8px"><input type="checkbox" id="chk-'+p.id+'"> 我已核对完整载荷，理解批准后的外部影响</label>'+
    '<div class="v3-rowline">'+
      '<button class="btn primary" data-act="proposal-approve" data-id="'+p.id+'" '+(st==='expired'?'disabled':'')+'>批准（模拟）</button>'+
      '<button class="btn" data-act="proposal-execute" data-id="'+p.id+'" '+(st==='approved'?'':'disabled')+'>模拟执行</button>'+
      '<button class="btn" data-act="proposal-reject" data-id="'+p.id+'">拒绝</button>'+
      '<button class="btn" data-act="close-modal">关闭</button>'+
    '</div>'+
    '<div class="demo-warning">演示环境：批准与执行只写本地审计记录，不会发送邮件、不会修改 X。</div>');
}
function approveProposal(id){
  var p=S.proposals.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  if(pState(p)==='expired') return toast('该动作已过期，需重新生成');
  var chk=document.getElementById('chk-'+id);
  if(!chk || !chk.checked) return toast('请先核对完整载荷并勾选确认');
  p.status='approved'; p.approvedAt=nowIso(); p.hash=hash(p.payload);
  audit('proposal.approved','已批准（模拟）：'+p.title);
  save(); closeModal(); render(); toast('已批准（模拟）：真实版本会在此刻重新校验授权与载荷');
}
function rejectProposal(id){
  var p=S.proposals.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  p.status='rejected'; p.rejectedAt=nowIso();
  audit('proposal.rejected','已拒绝：'+p.title);
  save(); closeModal(); render(); toast('已拒绝，未执行任何操作');
}
function executeProposal(id){
  var p=S.proposals.filter(function(x){ return x.id===id; })[0]; if(!p) return;
  if(p.status!=='approved') return toast('只有已批准的动作才能执行');
  p.status='executed'; p.executedAt=nowIso();
  if(p.kind==='local_tag'){
    S.posts.sort(function(a,b){ return (b.tags||[]).length-(a.tags||[]).length; }).slice(0, p.payload.count).forEach(function(post){
      post.tags=post.tags||[]; if(post.tags.indexOf(p.payload.label)<0) post.tags.push(p.payload.label);
    });
  }

function addCapture(){

  var scope = text ? (url?'链接 + 标题 + 选中片段':'标题 + 选中片段') : (url?(title?'链接 + 标题':'仅链接'):'仅文字');
  S.captures.unshift({ id:uid('c'), sourceApp:sourceApp, method:method, url:url, title:title, selectedText:text, scope:scope, capturedAt:nowIso(), state:'待整理' });

/* ---------- 事件 ---------- */
document.addEventListener('click', function(e){
  var t=e.target.closest ? e.target.closest('[data-act]') : null;
  if(!t) return;
  var act=t.dataset.act, id=t.dataset.id;
  if(t.tagName==='INPUT') return;
  switch(act){
    case 'go': S.page=id||'总览'; save(); render(); break;
    case 'assistant': S.assistant=id; sessionGrants={}; save(); render(); toast('已切换到 '+asName(id)+'（临时授权已清空）'); break;
    case 'switch-jarvis': S.assistant='jarvis'; sessionGrants={}; save(); render(); break;
    case 'grant': sessionGrants[id]=true; render(); toast('已授权本次会话查看「'+id+'」'); break;
    case 'notice-ok': closeModal(); if(pendingSend){ var txt=pendingSend; pendingSend=null; doSend(txt);} break;
    case 'notice-cancel': pendingSend=null; closeModal(); toast('已取消：没有产生任何请求'); break;
    case 'send-chat': sendChat(); break;
    case 'snapshot-new': genSnapshot(); break;
    case 'snapshot-accept': acceptSnapshot(id); break;
    case 'snapshot-discard': discardSnapshot(id); break;
    case 'snapshot-start': startFromSnapshot(id); break;
    case 'mail-draft': mailDraft(id); break;
    case 'mail-todo': (function(){ var e=S.emails.filter(function(x){return x.id===id;})[0]; if(e){ addTodo('处理邮件：'+e.subject,'高','今天','邮件 · '+e.from); save(); render(); toast('已生成待办并关联来源'); } })(); break;
    case 'mail-read': (function(){ var e=S.emails.filter(function(x){return x.id===id;})[0]; if(e){ e.unread=!e.unread; save(); paintMail(); } })(); break;
    case 'draft-save': saveDraft(); break;
    case 'draft-cancel': S.draft=null; save(); render(); toast('已取消草稿'); break;
    case 'post-tag': addPostTag(id); break;
    case 'kb-add': (function(){
        var title=(document.getElementById('note-title')||{}).value||'', body=(document.getElementById('note-body')||{}).value||'';
        if(!title.trim()) return toast('先填写笔记标题');
        S.notes.unshift({ id:uid('n'), title:title.trim(), meta:'刚刚 · 本地演示', body:body.trim() });
        save(); render(); toast('笔记已保存到本地知识库');
      })(); break;
    case 'kb-todo': (function(){ var n=S.notes.filter(function(x){return x.id===id;})[0]; if(n){ addTodo(clip(n.title,40),'普通','明天','知识库 · '+n.title); save(); render(); toast('已从笔记生成待办'); } })(); break;
    case 'kb-del': S.notes=S.notes.filter(function(x){ return x.id!==id; }); save(); render(); toast('笔记已删除'); break;
    case 'todo-add': newTodoFromForm(); break;
    case 'todo-del': S.todos=S.todos.filter(function(x){ return x.id!==id; }); save(); render(); toast('待办已删除'); break;
    case 'proposal-open': openProposal(id); break;
    case 'proposal-approve': approveProposal(id); break;
    case 'proposal-reject': rejectProposal(id); break;
    case 'proposal-execute': executeProposal(id); break;
    case 'mem-new': (function(){
        var ns=(document.getElementById('mem-new-ns')||{}).value||'陪伴记忆';
        var body=(document.getElementById('mem-new-body')||{}).value||'';
        var src=(document.getElementById('mem-new-src')||{}).value||'';
        if(!body.trim()) return toast('先写下要记住的内容');
        addMemory(ns, body.trim(), src.trim());
        save(); render(); toast('记忆已保存，仅对许可的助手可见');
      })(); break;
    case 'mem-edit': editMemory(id); break;
    case 'mem-save': (function(){
        var m=findMem(id); var v=(document.getElementById('mem-edit-body')||{}).value||'';
        if(!m || !v.trim()) return toast('内容不能为空');
        m.content=v.trim(); m.approvedAt=nowIso();
        audit('memory.edited','改写记忆：'+clip(v,18));
        save(); closeModal(); render(); toast('已更新，来源保留');
      })(); break;
    case 'mem-forget': (function(){
        var m=findMem(id); if(!m) return;
        m.forgotten=!m.forgotten;
        audit(m.forgotten?'memory.forgotten':'memory.restored', clip(m.content,18));
        save(); render(); toast(m.forgotten?'已禁记：检索与续聊卡不再返回':'已恢复召回');
      })(); break;
    case 'mem-delete': (function(){
        var m=findMem(id); if(!m) return;
        S.memories=S.memories.filter(function(x){ return x.id!==id; });
        audit('memory.deleted','删除记忆：'+clip(m.content,18));
        save(); render(); toast('已删除，检索与续聊卡不再引用');
      })(); break;
    case 'mem-share': shareMemory(id); break;
    case 'mem-share-ok': (function(){
        var m=findMem(id); if(!m) return;
        var other=S.assistant==='companion'?'jarvis':'companion';
        S.memories.push({ id:uid('mem'), ns:m.ns, cls:(m.cls||'')+' · 分享副本', content:m.content, sources:(m.sources||[]).concat(['分享自 '+asName(S.assistant)]), confidence:m.confidence, approvedAt:nowIso(), visible:[other], sharedFrom:m.id });
        audit('memory.shared','分享「'+clip(m.content,16)+'」给 '+asName(other));
        save(); closeModal(); render(); toast('已创建受限副本，仅 '+asName(other)+' 可读');
      })(); break;
    case 'cap-add': addCapture(); break;
    case 'cap-clip': (function(){
        if(!navigator.clipboard || !navigator.clipboard.readText) return toast('当前浏览器不允许读取剪贴板，请手动粘贴');
        navigator.clipboard.readText().then(function(txt){
          var el=document.getElementById('cap-text'); if(el){ el.value=txt; }
          toast('已读入剪贴板内容，确认后再收集');
        }).catch(function(){ toast('读取剪贴板失败（file:// 常被限制），请手动粘贴'); });
      })(); break;
    case 'cap-todo': (function(){ var c=findCap(id); if(c){ addTodo(clip(c.title||c.selectedText||'收集项',40),'普通','明天',c.sourceApp+' · 收集'); save(); render(); toast('已转成待办'); } })(); break;
    case 'cap-note': (function(){ var c=findCap(id); if(!c) return; S.notes.unshift({ id:uid('n'), title:c.title||clip(c.selectedText,20), meta:c.sourceApp+' · 收集于'+rel(c.capturedAt), body:c.selectedText||c.url||'' }); S.captures=S.captures.filter(function(x){ return x.id!==id; }); save(); render(); toast('已归档到知识库'); })(); break;
    case 'cap-del': S.captures=S.captures.filter(function(x){ return x.id!==id; }); save(); render(); toast('收集项已删除'); break;
    case 'toggle': S.settings[id]=!S.settings[id]; save(); render(); toast((id==='noticeEvery'?'发送前提示':'减弱动效')+'：'+(S.settings[id]?'开启':'关闭')); break;
    case 'settings-names': (function(){
        var c=(document.getElementById('set-companion')||{}).value||'', j=(document.getElementById('set-jarvis')||{}).value||'';
        if(!c.trim()||!j.trim()) return toast('名称不能为空');
        S.settings.companionName=c.trim(); S.settings.jarvisName=j.trim(); save(); render(); toast('助手名称已更新');
      })(); break;
    case 'export': exportJSON(); break;
    case 'selftest': runSelfTest(); break;
    case 'reset': showSheet('<h2>清空本地演示数据？</h2><p class="v3-sub">会删除本浏览器里的待办、笔记、记忆、收集项与审计记录，并回到初始演示数据。真实账号不受影响（本来也没有连接）。</p><div class="v3-rowline"><button class="btn primary" data-act="reset-ok">确认清空</button><button class="btn" data-act="close-modal">取消</button></div>'); break;
    case 'reset-ok': S=normalize(seedData()); save(); closeModal(); render(); toast('已重置为初始演示数据'); break;
    case 'close-modal': closeModal(); break;
    default: break;
  }
});
document.addEventListener('change', function(e){
  var t=e.target; if(!t || !t.dataset) return;
  var act=t.dataset.act;
  if(act==='todo-toggle'){
    var todo=S.todos.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(todo){ todo.status=t.checked?'done':'open'; audit('todo.status', (todo.status==='done'?'完成：':'重开：')+todo.title); save(); render(); }
    return;
  }
  var edit=t.dataset.edit;
  if(edit==='payload-body'){
    var p=S.proposals.filter(function(x){ return x.id===t.dataset.id; })[0];
    if(p){
      p.payload.body=t.value;
      p.hash=hash(p.payload);
      var invalidated=false;
      if(p.status==='approved'||p.status==='executed'){ p.status='pending'; p.approvedAt=null; invalidated=true; audit('proposal.invalidated','载荷变更，旧批准失效：'+p.title); }
      save();
      /* 只更新弹窗里的哈希/状态并清掉确认勾选，避免整块重绘吞掉这次点击 */
      var hv=document.getElementById('hashv-'+p.id); if(hv) hv.textContent=p.hash;
      var stv=document.getElementById('stt-'+p.id); if(stv) stv.textContent=STATE_LABEL.pending;
      var chk=document.getElementById('chk-'+p.id); if(chk) chk.checked=false;
      toast(invalidated?'载荷变更：旧批准已失效，请重新核对':'载荷已更新，请重新核对后批准');
    }
    return;
  }
  var f=t.dataset.field;
  if(f==='mail-filter'){ S.ui.mailFilter=t.value; save(); paintMail(); }
  else if(f==='post-source'){ S.ui.postSource=t.value; save(); paintPosts(); }
  else if(f==='post-topic'){ S.ui.postTopic=t.value; save(); paintPosts(); }
  else if(f==='mem-ns'){ S.ui.memNs=t.value; save(); paintMemories(); }
});
document.addEventListener('input', function(e){
  var t=e.target; if(!t || !t.dataset || !t.dataset.field) return;
  var f=t.dataset.field;
  if(f==='mail-q'){ S.ui.mailQ=t.value; save(); paintMail(); }
  else if(f==='post-q'){ S.ui.postQ=t.value; save(); paintPosts(); }
  else if(f==='kb-q'){ S.ui.kbQ=t.value; save(); paintNotes(); }
});
document.addEventListener('keydown', function(e){
  var t=e.target;
  if(t && t.id==='chat-input' && e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
  if(e.key==='Escape'){ closeModal(); }
});

/* ---------- 局部重绘（不打断输入焦点） ---------- */
function paintMail(){ var el=document.getElementById('mail-list'); if(el) el.innerHTML=mailListHTML(); }
function paintPosts(){ var el=document.getElementById('post-list'); if(el) el.innerHTML=postListHTML(); }
function paintNotes(){ var el=document.getElementById('note-list'); if(el) el.innerHTML=noteListHTML(); }
function paintMemories(){ var el=document.getElementById('mem-list'); if(el) el.innerHTML=memListHTML(); }

/* ---------- 查找 ---------- */
function findMem(id){ return S.memories.filter(function(m){ return m.id===id; })[0]; }
function findCap(id){ return S.captures.filter(function(c){ return c.id===id; })[0]; }

/* ---------- 导出 ---------- */
function exportJSON(){
  try{
    var blob=new Blob([JSON.stringify(S,null,2)],{ type:'application/json' });
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='jarvis-preview-v3.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
    toast('已导出本地演示数据');
  }catch(err){ toast('当前浏览器不允许导出文件'); }
}

/* ---------- 自检（在内存副本上跑，不动用户数据与 localStorage） ---------- */
function runSelfTest(){
  var backup=S, results=[];
  function ok(name, cond, detail){ results.push([!!cond, name, detail||'']); }
  try{
    S=normalize(seedData());   /* 用初始演示数据做副本，结果不受你当前数据影响 */
    ok('记忆默认不跨助手可见',
      memFor('companion').every(function(m){ return m.visible.indexOf('companion')>=0; }) &&
      memFor('jarvis').every(function(m){ return m.visible.indexOf('jarvis')>=0; }));
    ok('工作记忆对陪伴助手不可见', memFor('companion').filter(function(m){ return m.ns==='work'; }).length===0);
    ok('陪伴记忆对 Jarvis 不可见', memFor('jarvis').filter(function(m){ return m.ns==='companion'; }).length===0);

    var m3=findMem('mem3');
    if(m3) m3.forgotten=true;
    ok('禁记后检索不再返回',
      recall('companion','连续性').every(function(x){ return x.id!=='mem3'; }),
      'mem3 若存在必被排除');

    var before=memFor('jarvis').length;
    S.memories.push({ id:'mem_selftest', ns:'companion', cls:'分享副本', content:'自检样本', sources:['自检'], confidence:1, approvedAt:nowIso(), visible:['jarvis'] });
    ok('分享副本只对目标助手可见',
      memFor('jarvis').length===before+1 && memFor('companion').filter(function(x){ return x.id==='mem_selftest'; }).length===0);

    var p=S.proposals[0];
    var st0=pState(p);
    p.payload.body=(p.payload.body||'')+'（改动）';
    ok('载荷变更使旧批准失效', st0!=='changed' && pState(p)==='changed');
    var q=S.proposals[1];
    if(q){ q.expiresAt=new Date(Date.now()-60000).toISOString(); }
    ok('过期动作被识别', !!q && pState(q)==='expired');

    var open0=openTodos().length;
    S.todos[1].status='done';
    ok('完成待办只影响它自己', openTodos().length===open0-1);

    S.ui.mailFilter='需要回复';
    var html=mailListHTML();
    ok('邮件筛选只返回需回复', html.indexOf('关于周五产品评审的材料')>=0 && html.indexOf('你的每周工作摘要')<0);

    S.ui.postSource='点赞'; S.ui.postTopic='全部主题';
    var ph=postListHTML();
    ok('收藏按来源筛选', ph.indexOf('@linh_builds')>=0 && ph.indexOf('@designsystems')<0);

    var c0=S.chat.companion.length, j0=S.chat.jarvis.length;
    S.chat.jarvis.push({ id:'selftest', role:'me', text:'t', at:nowIso() });
    ok('两个助手会话互不影响', S.chat.companion.length===c0 && S.chat.jarvis.length===j0+1);

    var rt=JSON.parse(JSON.stringify(S));
    ok('状态可序列化往返', !!rt && rt.memories.length===S.memories.length);
  }catch(err){
    results.push([false, '自检中断：'+(err && err.message ? err.message : err), '']);
  }finally{ S=backup; }
  var pass=results.filter(function(r){ return r[0]; }).length;
  showSheet('<h2>自检 '+pass+' / '+results.length+'</h2>'+
    '<p class="v3-sub">基于初始演示数据的副本运行，不改动你的数据与 localStorage。也可直接用 preview.html?selftest=1 打开。</p>'+
    results.map(function(r){
      return '<div class="v3-audit"><b'+(r[0]?'':' class="v3-lock"')+'>'+(r[0]?'✓ PASS':'✗ FAIL')+'</b><span>'+esc(r[1])+'</span><span>'+esc(r[2])+'</span></div>';
    }).join('')+
    '<div class="v3-rowline"><button class="btn" data-act="close-modal">关闭</button></div>');
  try{ console.table(results.map(function(r){ return { ok:r[0], test:r[1] }; })); }catch(e){}
}

/* ---------- 交互自检（在真实浏览器里跑点击链路；preview.html?e2e=1） ---------- */
function runE2E(){
  var backup=S, out=[];
  function ok(name, cond, detail){ out.push([!!cond, name, detail||'']); }
  function q(sel){ return document.querySelector(sel); }
  function click(sel){ var el=q(sel); if(!el){ ok('找不到元素 '+sel, false); return false; } el.dispatchEvent(new MouseEvent('click',{ bubbles:true })); return true; }
  try{
    S = normalize(seedData()); render();

    click('[data-act="go"][data-id="邮件"]');
    ok('导航到邮件页', !!q('#mail-q') && !!q('#mail-list'));

    var m1 = S.emails[0].id;
    click('[data-act="mail-draft"][data-id="'+m1+'"]');
    ok('草稿绑定该邮件', !!q('#draft-to') && q('#draft-to').value.indexOf('@')>0);

    var before = S.proposals.length;
    q('#draft-subject').value = 'Re: E2E 草稿';
    q('#draft-body').value = 'E2E 正文';
    click('[data-act="draft-save"]');
    ok('保存草稿进入审批队列', S.proposals.length === before+1 && S.proposals[0].kind === 'email_draft');

    click('[data-act="go"][data-id="审批"]');
    var pid = S.proposals[0].id;
    click('[data-act="proposal-open"][data-id="'+pid+'"]');
    ok('载荷抽屉打开', !!q('#chk-'+pid));
    q('#chk-'+pid).checked = true;
    click('[data-act="proposal-approve"][data-id="'+pid+'"]');
    ok('批准后状态为已批准', S.proposals[0].status === 'approved');

    click('[data-act="go"][data-id="记忆"]');
    S.ui.memNs = '全部';
    var victim = memFor(S.assistant)[0].id;
    click('[data-act="mem-forget"][data-id="'+victim+'"]');
    ok('禁记后不再可召回', memFor(S.assistant).map(function(m){ return m.id; }).indexOf(victim) < 0);

    click('[data-act="assistant"][data-id="companion"]');
    click('[data-act="go"][data-id="邮件"]');
    ok('陪伴助手看到授权门', !!q('[data-act="grant"]'));
    click('[data-act="grant"][data-id="邮件"]');
    ok('本次授权后可读邮件', !!q('#mail-q'));

    click('[data-act="go"][data-id="对话"]');
    var n0 = S.chat.companion.length;
    q('#chat-input').value = '你好，帮我记住这件事';
    click('[data-act="send-chat"]');
    ok('发送前提示出现', !!q('[data-act="notice-cancel"]'));
    click('[data-act="notice-cancel"]');
    ok('取消后不产生消息', S.chat.companion.length === n0);

    q('#chat-input').value = '你好，帮我记住这件事';
    click('[data-act="send-chat"]');
    click('[data-act="notice-ok"]');
    ok('继续后新增一问一答', S.chat.companion.length === n0+2);

    click('[data-act="go"][data-id="设置"]');
    click('[data-act="toggle"][data-id="reduced"]');
    ok('减弱动效立即生效', document.body.classList.contains('v3-reduced'));
  }catch(err){
    out.push([false, '交互自检中断：'+(err && err.message ? err.message : err), '']);
  }finally{
    S = backup; render();
  }
  var pass = out.filter(function(r){ return r[0]; }).length;
  showSheet('<h2>交互自检 '+pass+' / '+out.length+'</h2>'+
    '<p class="v3-sub">在真实浏览器里派发点击事件，验证事件委托链路；结束后恢复原状态与存储。</p>'+
    out.map(function(r){
      return '<div class="v3-audit"><b'+(r[0]?'':' class="v3-lock"')+'>'+(r[0]?'✓ PASS':'✗ FAIL')+'</b><span>'+esc(r[1])+'</span><span>'+esc(r[2])+'</span></div>';
    }).join('')+
    '<div class="v3-rowline"><button class="btn" data-act="close-modal">关闭</button></div>');
}

/* ---------- 启动 ---------- */
/* QA 深链接：?page=记忆&assistant=companion（只影响本次打开，不写回存储） */
(function deepLink(){
  var m = /[?&]page=([^&]+)/.exec(location.search);
  if(m){ try{ S.page = decodeURIComponent(m[1]); }catch(e){ S.page = m[1]; } }
  var a = /[?&]assistant=([^&]+)/.exec(location.search);
  if(a && (a[1] === 'companion' || a[1] === 'jarvis')) S.assistant = a[1];
})();
render();
if(/[?&]selftest/.test(location.search)) runSelfTest();
if(/[?&]e2e/.test(location.search)) runE2E();
})();
</script>
